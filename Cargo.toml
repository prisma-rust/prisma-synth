[workspace]
resolver = "2"
members = ["crates/geiger-core", "crates/geiger-cli", "crates/synth-ffi"]
default-members = ["crates/geiger-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
geiger-core = { path = "crates/geiger-core" }

[profile.release]
opt-level = 3
lto = "thin"
